# Enable stateless CSRF protection for forms and logins/logouts
framework:
    form:
        csrf_protection:
            token_id: submit

    csrf_protection:
        # « authenticate » et « logout » utilisent des jetons de SESSION (connexion/déconnexion) :
        # ils fonctionnent sans JavaScript et sont vérifiables en test.
        stateless_token_ids:
            - submit
