doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'

        types:
            # Stockage et relecture systématiques en UTC (PHP tourne en Europe/Paris).
            datetime_immutable: App\Shared\Infrastructure\UtcDateTimeImmutableType
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        auto_mapping: true
        mappings:
            Identity:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Identity/Domain'
                prefix: 'App\Identity\Domain'
            Event:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Event/Domain'
                prefix: 'App\Event\Domain'
            Municipality:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Municipality/Domain'
                prefix: 'App\Municipality\Domain'
            Onboarding:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Onboarding/Domain'
                prefix: 'App\Onboarding\Domain'
            Shared:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Shared/Domain'
                prefix: 'App\Shared\Domain'

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
