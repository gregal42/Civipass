# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session:
        cookie_secure: auto
        cookie_httponly: true
        cookie_samesite: lax

    # Limiteurs de la connexion : 5 tentatives / 15 min par identifiant+IP ; 50 / 15 min par IP
    # (seuil large pour les réseaux partagés : mairies, NAT d'entreprise).
    rate_limiter:
        login_local:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
        login_global:
            policy: sliding_window
            limit: 50
            interval: '15 minutes'
        # Page bénéficiaire (LOT 05.2) : plafond de requêtes par IP, et plafond d'ÉCHECS (lien inconnu, expiré ou révoqué) contre la découverte de
        # liens ; au-delà, 429 avant toute recherche. Seuils larges pour les réseaux partagés.
        pass_access:
            policy: sliding_window
            limit: 120
            interval: '10 minutes'
        pass_failure:
            policy: sliding_window
            limit: 20
            interval: '15 minutes'
        # Mot de passe oublié : 3 demandes / heure par adresse, 10 / heure par IP (réponse identique, envoi
        # abandonné en silence au-delà) ; 10 validations ou soumissions de jeton / 15 min par IP.
        password_reset_email:
            policy: sliding_window
            limit: 3
            interval: '1 hour'
        password_reset_ip:
            policy: sliding_window
            limit: 10
            interval: '1 hour'
        password_reset_token_ip:
            policy: sliding_window
            limit: 10
            interval: '15 minutes'
        # Liens d'invitation : 30 ouvertures de lien / 15 min par IP ; 5 désignations d'administrateur / heure par lien ;
        # 10 inscriptions d'administrateur / 15 min par IP.
        invitation_link_ip:
            policy: sliding_window
            limit: 30
            interval: '15 minutes'
        invitation_delegation:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
        # Dépôt public de demande : 40 téléversements de justificatifs / 15 min par IP (stockage et analyse bornés).
        public_request_upload_ip:
            policy: sliding_window
            limit: 40
            interval: '15 minutes'
        invitation_enroll_ip:
            policy: sliding_window
            limit: 10
            interval: '15 minutes'

    #esi: true
    #fragments: true

# Proxys de confiance : AUCUN par défaut (en-têtes X-Forwarded-* d'un client ignorés). Seul le développement
# local, derrière Traefik (réseaux privés Docker), en déclare. Voir docs/authentication.md.
when@dev:
    framework:
        # Le seul proxy de confiance est Traefik, déclaré par SYMFONY_TRUSTED_PROXIES (.env.local de la machine : adresse de Traefik sur le réseau
        # Docker `reverse_proxy`, voir docs/authentication.md). Plus de `private_ranges` : un conteneur voisin du même réseau n'est pas un proxy.
        # Variable absente : aucun proxy de confiance, l'IP vue est celle de Traefik (échec fermé : limiteurs plus stricts, jamais contournables).
        trusted_headers: ['x-forwarded-for', 'x-forwarded-proto', 'x-forwarded-port']

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
