# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Expéditeur des emails (à définir en production) ; valeur de repli non routable.
    env(MAILER_FROM): 'no-reply@civipass.invalid'
    # Plafonds de sécurité du module Event (DM-096), appliqués côté backend ; surchargeables par l'environnement.
    # Référentiel national des communes : source officielle (API Géo) et nombre minimal de communes attendu d'un import complet
    # (en dessous, la réponse est jugée partielle et l'import refusé).
    env(GEO_API_URL): 'https://geo.api.gouv.fr/communes'
    env(NATIONAL_COMMUNES_MIN_COUNT): '30000'
    # Stockage privé des fichiers (hors du répertoire public) : jamais servi par le serveur web.
    # Page de la politique de confidentialité vers laquelle l'attestation du formulaire public renvoie (aucun lien si vide :
    # le texte juridique relève des collectivités et de leur DPO).
    env(PRIVACY_POLICY_URL): ''
    env(PRIVATE_STORAGE_DIR): '%kernel.project_dir%/var/storage'
    env(EVENT_MAX_SLOTS_PER_VALIDITY): '500'
    # Contrôle public `/v/{jeton}` (LOT 05.4.2) : DÉSACTIVÉ par défaut (la route répond 404 sans toucher à la base). Ne l'activer qu'avec l'accord
    # du responsable, une fois les conditions d'exposition réunies (journaux nginx et Traefik vérifiés, limitation de débit du 05.4.3).
    env(PUBLIC_VERIFICATION_ENABLED): '0'
    # Plafonds PROVISOIRES de la limitation de débit du contrôle public (LOT 05.4.3), par IP (IPv6 : /64) : consultations sur 10 minutes ; jetons bien
    # formés mais inconnus sur 15 minutes.
    env(VERIFICATION_ACCESS_LIMIT): '300'
    env(VERIFICATION_FAILURE_LIMIT): '20'
    env(EVENT_MAX_ZONES_PER_BULK_OPERATION): '100'
    # Seuil PROVISOIRE de confidentialité des bilans statistiques de clôture (LOT 05.6.2) : effectifs non nuls inférieurs au seuil masqués. À valider par le DPO.
    env(CLOSURE_STATISTICS_MIN_COUNT): '5'
    # Archives (LOT 05.6.3) : HYPOTHÈSES à valider avec le DPO et les archives avant production. Durée de l'accès à l'archive après la clôture (sauf gel actif),
    # période de revue d'un gel de conservation, validité d'un lien de consultation.
    env(ARCHIVE_RETENTION_MONTHS): '12'
    env(ARCHIVE_HOLD_REVIEW_MONTHS): '6'
    env(ARCHIVE_CONSULTATION_MINUTES): '30'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        # Entités, objets valeur, enums et interfaces de domaine, ainsi que les DTO, ne sont pas des services
        # (les interfaces sont reliées à leur implémentation par #[AsAlias]).
        exclude: &non_services
            - '../src/Kernel.php'
            - '../src/*/Domain/'
            - '../src/Shared/Application/AuditEvent.php'
            - '../src/Municipality/Application/SynchronizationReport.php'
            - '../src/Municipality/Application/DryRunCompleted.php'
            - '../src/Event/Application/AccessDecision.php'
            - '../src/Event/Application/Read/'
            - '../src/Event/Application/Command/'
            - '../src/Event/Application/Result/'
            - '../src/Event/Application/Support/ParsedValidity.php'
            - '../src/Event/Application/Support/ZoneValidityPlan.php'
            - '../src/Permit/Application/Result/'
            - '../src/Permit/Application/Read/'
            - '../src/Request/Application/Command/'
            - '../src/Request/Application/Read/'
            - '../src/Request/Application/Result/'
            - '../src/Request/UI/Http/PublicRequestDraft.php'
            - '../src/Request/UI/Http/RequestFormContext.php'
            - '../src/Archive/Application/ArchiveAccess.php'
            - '../src/Archive/Application/ArchiveConsultationExpired.php'
            - '../src/Archive/Application/Read/'

    # Objet de domaine sans dépendance obligatoire (le référentiel communal des fuseaux est fourni plus tard).
    App\Event\Domain\Time\TerritoryTimezoneResolver: ~

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

when@test:
    parameters:
        # Stockage isolé des tests (jamais le stockage réel).
        env(PRIVATE_STORAGE_DIR): '%kernel.project_dir%/var/storage_test'

    services:
        # Mêmes classes, mêmes alias (#[AsAlias]) et mêmes dépendances qu'en production : seule la visibilité change,
        # pour que le conteneur de test puisse lire les services (sinon supprimés car non référencés).
        _defaults:
            autowire: true
            autoconfigure: true
            public: true

        App\:
            resource: '../src/'
            exclude: *non_services
